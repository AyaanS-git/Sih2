<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediKiosk — AI-Powered Clinical History & Medical Records Digitization Platform</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              700: '#005536',
              600: '#006B45', // Primary Dark Green
              500: '#0A8F5B', // Medium Green
              400: '#10B981',
              100: '#E6F4ED',
              50:  '#F0FDF4',
            },
            clinical: {
              700: '#1E3A8A',
              600: '#1E40AF',
              500: '#2563EB',
              50:  '#EFF6FF',
            }
          },
          fontFamily: {
            sans: ['Inter', 'Noto Sans Devanagari', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- html2pdf for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Tesseract.js for Real-Time OCR Document Scanning -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <!-- Google Fonts: Inter & Noto Sans Devanagari -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    @keyframes radarPulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .radar-pulse {
      animation: radarPulse 2s infinite ease-in-out;
    }

    @media print {
      header, footer, button, .no-print {
        display: none !important;
      }
      body, #root {
        background: white !important;
        padding: 0 !important;
      }
      #summary-pdf-content {
        box-shadow: none !important;
        border: 1px solid #CBD5E1 !important;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body class="h-full text-slate-800 antialiased selection:bg-emerald-200">
  <div id="root" class="min-h-screen flex flex-col"></div>

  <!-- Load App Script -->
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
